<style>
/* Layout: lesson rail, then a lesson board: life-link card + challenge card side by side, task (and simulations) below. */
:root{
  --bg:#f6f4fb; --card:#ffffff; --ink:#1d2b4f; --muted:#5d6b88; --line:#ddd8ec;
  --plum:#7a3e9d; --gold:#e3a21a; --mint:#1fae8a; --blue:#3b6fe0; --coral:#f0645a;
  --ok:#17a673; --bad:#e04d4d; --soft:#f1ecfa;
  --f-display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15122a;--card:#1f1b38;--ink:#efeaff;--muted:#b0a8cc;--line:#352f57;--soft:#2a2448;--plum:#c08ae0;--gold:#ffc54d;--mint:#3fd2aa;--blue:#7aa0ff;--coral:#ff8a80;--ok:#3fd29a;--bad:#ff7070;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15122a;--card:#1f1b38;--ink:#efeaff;--muted:#b0a8cc;--line:#352f57;--soft:#2a2448;--plum:#c08ae0;--gold:#ffc54d;--mint:#3fd2aa;--blue:#7aa0ff;--coral:#ff8a80;--ok:#3fd29a;--bad:#ff7070;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--f-body);font-size:17px;line-height:1.7}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.credit{font-size:13px;color:var(--muted);text-align:left;margin-bottom:-8px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4vw,44px);line-height:1.15;margin:0}
h1 span{color:var(--plum)}
.sub{color:var(--muted);margin:0}
button,a.btn{font-family:inherit;font-size:16px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:border-color .12s,transform .12s}
button:hover,a.btn:hover{border-color:var(--plum)}
button:active{transform:scale(.97)}
button:focus-visible,a.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.rail{display:flex;flex-direction:column;gap:8px}
.chap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chap b{font-family:var(--f-display);font-size:17px;color:var(--muted)}
.lesson[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff;font-weight:700}
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
@media (max-width:860px){.board{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tag{align-self:flex-start;font-family:var(--f-display);font-weight:800;font-size:15px;color:#fff;border-radius:999px;padding:2px 14px}
.card h2{font-family:var(--f-display);font-size:26px;line-height:1.25;margin:0}
.card p{margin:0}
.life{background:linear-gradient(0deg,var(--card),var(--card)) padding-box;border-color:color-mix(in srgb,var(--mint) 45%,var(--line))}
.life .tag{background:var(--mint)}
.chal .tag{background:var(--plum)}
.task .tag{background:var(--gold);color:#3a2600}
.sims .tag{background:var(--blue)}
.q{font-family:var(--f-display);font-size:clamp(20px,2.4vw,25px);font-weight:700;line-height:1.4}
.opts{display:grid;gap:8px}
.opt{justify-content:flex-start;text-align:right;padding:10px 14px;font-size:17px;width:100%}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.why{border-radius:14px;padding:10px 14px;background:var(--soft);font-size:16px}
.why b{color:var(--plum)}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)} .dots i.no{background:var(--bad)} .dots i.cur{outline:3px solid var(--plum);outline-offset:1px}
.stars{font-size:26px;color:var(--gold);letter-spacing:3px}
.lower{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.lower{grid-template-columns:minmax(0,1fr)}}
.lower.single{grid-template-columns:minmax(0,1fr)}
.task ol{margin:0;padding-inline-start:22px}
.task li{margin-bottom:4px}
.simgrid{display:flex;flex-wrap:wrap;gap:8px}
.simgrid a{flex:1 1 180px;justify-content:center;font-weight:700}
.big{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
const CH={1:'الفصل الأول: مقدمة في علم الكيمياء',2:'الفصل الثاني: المادة - الخواص والتغيرات',3:'الفصل الثالث: تركيب الذرة'};
const SIMS={cath:['sim-cathode.html','محاكاة أشعة المهبط'],ruth:['sim-rutherford.html','محاكاة تجربة رذرفورد'],comp:['sim-compare.html','طومسون أمام رذرفورد'],neut:['sim-neutral.html','لماذا الذرة متعادلة؟']};
const D={
l11:{ch:1,name:'قصة مادتين',life:['المملكة تحمي طبقة الأوزون','انضمت المملكة إلى بروتوكول مونتريال للحد من المواد التي تفكك طبقة الأوزون، وتُستعمل اليوم في المكيفات والثلاجات غازات بديلة لا تضر الأوزون. وتدعم مبادرة السعودية الخضراء حماية البيئة والغلاف الجوي.'],
 ch_:[['لماذا بقي ثقب الأوزون سنوات طويلة رغم إيقاف استعمال مركبات CFCs؟',['لأن مركبات CFCs مستقرة وتبقى في الجو مدة طويلة','لأن الأوزون لا يتكون مرة أخرى أبدًا','لأن الأشعة فوق البنفسجية توقفت','لأن CFCs تتحول إلى أوزون'],0,'مركبات CFCs مستقرة جدًا، فتبقى في الغلاف الجوي سنوات طويلة وتستمر في تفكيك الأوزون قبل أن تختفي.'],
  ['لو اختفت طبقة الأوزون تمامًا، أي مشكلة نتوقع أن تزيد؟',['نقص الأكسجين في الهواء','حروق الجلد وأضرار العين','تجمد مياه المحيطات','توقف هطول الأمطار'],1,'الأوزون يمتص معظم الأشعة فوق البنفسجية الضارة، وبدونه تصل كميات كبيرة منها إلى الإنسان.'],
  ['اعتقد العلماء أولًا أن مركبات CFCs آمنة، ثم اكتشفوا ضررها. ماذا تعلّمنا هذه القصة عن العلم؟',['العلماء لا يخطئون أبدًا','كل المواد الصناعية ضارة','تُراجَع النتائج العلمية عند ظهور أدلة جديدة','لا داعي لمراقبة البيئة'],2,'العلم يتطور، والأدلة الجديدة قد تغيّر ما كنا نعتقده صحيحًا.']],
 task:['ابحثي عن غاز بديل لمركبات CFCs يُستعمل في المكيفات اليوم.','اكتبي اسمه وميزة واحدة له مقارنة بمركبات CFCs.','شاركي ما وجدتِه مع زميلاتك في الحصة القادمة.']},
l12:{ch:1,name:'الكيمياء والمادة',life:['رواد الفضاء السعوديون','في عام 2023م انطلقت ريانة برناوي وعلي القرني إلى محطة الفضاء الدولية. هناك يطفو كل شيء، فيبدو رائد الفضاء كأنه بلا وزن، لكن كتلة جسمه بقيت كما هي تمامًا.'],
 ch_:[['يطفو رائد الفضاء داخل المحطة الفضائية. ماذا حدث لكتلته؟',['أصبحت صفرًا','بقيت كما هي','زادت','نقصت إلى النصف'],1,'الكتلة مقياس لكمية المادة، ولا تتغير بتغير المكان. الذي تغيّر هو الإحساس بالوزن.'],
  ['لماذا يستعمل العلماء الكتلة بدل الوزن في قياساتهم؟',['لأن الوزن لا يمكن قياسه','لأن الكتلة أكبر دائمًا من الوزن','لأن الوزن خاصية كيميائية','لأن الكتلة لا تتغير بتغير المكان'],3,'الوزن يتغير حسب قوة الجاذبية، أما الكتلة فثابتة، فتصلح للمقارنة بين النتائج في أي مكان.'],
  ['عالمة تدرس تلوث مياه الخليج العربي بالنفط. أي فرع كيمياء يناسب عملها أكثر؟',['الكيمياء البيئية','الكيمياء الحيوية','كيمياء المبلمرات','الكيمياء الحرارية'],0,'الكيمياء البيئية تدرس المواد في البيئة وأثرها، ومنها التلوث.']],
 task:['اختاري مهنة تحبينها (طبيبة، مهندسة، صيدلانية…).','ابحثي عن فرع الكيمياء المرتبط بها.','اكتبي مثالًا على عمل يقوم به الكيميائي في هذه المهنة.']},
l13:{ch:1,name:'الطرائق العلمية',life:['الأولمبياد الوطني للإبداع العلمي «إبداع»','تشارك طالبات المملكة كل عام في أولمبياد «إبداع» بمشاريع علمية. وكل مشروع يبدأ بملاحظة وسؤال، ثم فرضية وتجارب مضبوطة، تمامًا كخطوات الطريقة العلمية التي درستِها.'],
 ch_:[['لاحظت طالبة أن النبات قرب النافذة ينمو أسرع. أي عبارة تصلح أن تكون فرضية؟',['النبات جميل','إذا زادت كمية الضوء زاد نمو النبات','أحب النباتات الخضراء','النبات يحتاج إلى عناية'],1,'الفرضية تفسير مؤقت يمكن اختباره بتجربة، وهذه العبارة تربط متغيرًا بآخر ويمكن قياسها.'],
  ['في تجربة أثر الضوء في نمو النبات، ما الذي يجب أن يبقى ثابتًا؟',['كمية الضوء','طول النبات في النهاية','كمية الماء ونوع التربة','لا شيء'],2,'نغيّر متغيرًا مستقلًا واحدًا (الضوء)، ونثبّت بقية العوامل حتى تكون النتيجة عادلة.'],
  ['تجربة أُعيدت عشرات المرات وأعطت النتيجة نفسها، وتصف ما يحدث دون أن تفسر سببه. هذه:',['فرضية','نظرية','ملاحظة','قانون علمي'],3,'القانون العلمي يصف علاقة موجودة في الطبيعة، والنظرية هي التي تفسر سبب حدوثها.']],
 task:['صمّمي تجربة منزلية بسيطة واكتبي سؤالها.','اكتبي فرضيتك، والمتغير المستقل، والمتغير التابع.','حدّدي العوامل التي ستثبّتينها، والضابط الذي ستقارنين به.']},
l14:{ch:1,name:'البحث العلمي',life:['تحلية المياه في المملكة','تُعد المملكة من أكبر منتجي المياه المحلاة في العالم. وتطوير تقنيات تحلية أقل تكلفة وأقل استهلاكًا للطاقة مثال واضح على البحث التطبيقي الذي يحل مشكلة حقيقية في حياتنا.'],
 ch_:[['فريق يبحث عن طريقة أرخص لتحلية مياه البحر. نوع بحثهم:',['بحث تطبيقي','بحث نظري','قانون علمي','ملاحظة'],0,'البحث التطبيقي يهدف إلى حل مشكلة محددة، وهنا المشكلة هي تكلفة التحلية.'],
  ['عالمة تدرس سلوك جزيئات الماء دون هدف عملي محدد. نوع بحثها:',['بحث تطبيقي','بحث نظري','تقنية','تجربة ضابطة'],1,'البحث النظري يُجرى من أجل المعرفة نفسها، وقد تُستعمل نتائجه لاحقًا في تطبيقات.'],
  ['لماذا يُمنع إرجاع الكاشف الزائد إلى عبوته الأصلية؟',['لأنه يتبخر بسرعة','لتوفير الوقت','حتى لا تتلوث المادة في العبوة','لأنه يصبح أثقل'],2,'الكاشف الذي خرج من العبوة قد يتلوث، وإرجاعه يفسد المادة كلها ويؤثر في نتائج التجارب.']],
 task:['ابحثي عن اكتشاف علمي حدث مصادفةً.','اكتبي اسمه، ومن اكتشفه، وكيف استُفيد منه.','هل كان البحث في بدايته نظريًا أم تطبيقيًا؟ علّلي.']},
l21:{ch:2,name:'خواص المادة',life:['ملح القصب في القصيم','في مدينة القصب بمنطقة القصيم يُستخرج الملح من برك يدخلها الماء ثم يتبخر، فتترسب طبقة من الملح الأبيض. وملح القصب له خواص ملح البحر وملح المنجم نفسها، لأن ملح الطعام مادة نقية تركيبها ثابت.'],
 ch_:[['لماذا لملح القصب وملح البحر الخواص نفسها؟',['لأن كليهما من القصيم','لأن ملح الطعام مادة نقية تركيبها ثابت','لأن لهما اللون نفسه فقط','لأنهما مخلوطان'],1,'المادة النقية لها التركيب نفسه دائمًا مهما كان مصدرها، فتكون خواصها واحدة.'],
  ['لديك قطعتان من الحديد مختلفتان في الحجم. أي خاصية تتساوى فيهما؟',['الكتلة','الحجم','الطول','الكثافة'],3,'الكثافة خاصية مميزة لا تعتمد على كمية المادة، أما الكتلة والحجم فتعتمدان عليها.'],
  ['لماذا يمكن ضغط الغاز، بينما يصعب ضغط المادة الصلبة؟',['لأن بين جسيمات الغاز مسافات كبيرة','لأن الغاز أثقل','لأن جسيمات الصلب متباعدة','لأن الغاز ليس مادة'],0,'جسيمات الغاز متباعدة، فيمكن تقريبها بالضغط، أما جسيمات الصلب فمتقاربة ومترابطة.']],
 task:['اختاري ثلاث مواد من مطبخك.','اكتبي لكل مادة خاصيتين فيزيائيتين وخاصية كيميائية واحدة.','حدّدي أي الخواص الفيزيائية مميزة وأيها غير مميزة.']},
l22:{ch:2,name:'تغيرات المادة',life:['الكيمياء في مطبخنا','في المطبخ تحدث تغيرات كيميائية كل يوم: تخمر عجينة الخبز وانتفاخها بغاز ثاني أكسيد الكربون، وتغيّر لون البصل عند التحمير. أما ذوبان السكر في الشاي فتغير فيزيائي.'],
 ch_:[['عند خبز الكيك ينتفخ ويتغير لونه ورائحته. هذا التغير:',['فيزيائي','تغير حالة فقط','كيميائي','لا يعد تغيرًا'],2,'تغير اللون والرائحة وتكوّن غاز مؤشرات على تكوّن مواد جديدة، أي تغير كيميائي.'],
  ['أُحرق شريط مغنيسيوم داخل وعاء مغلق تمامًا. ماذا يحدث لكتلة الوعاء ومحتوياته؟',['تزيد','تبقى كما هي','تنقص','تصبح صفرًا'],1,'في الوعاء المغلق لا يدخل شيء ولا يخرج، فتبقى الكتلة ثابتة حسب قانون حفظ الكتلة.'],
  ['أي مما يلي تغير فيزيائي فقط؟',['تحول الماء إلى بخار عند الغليان','تصاعد غاز عند إضافة الخل إلى بيكربونات الصوديوم','اسوداد شريحة التفاح','احتراق الخشب'],0,'الغليان تغير في الحالة فقط، والماء يبقى ماءً.']],
 task:['سجّلي ثلاثة تغيرات تحدث في بيتك خلال يوم واحد.','صنّفي كل تغير إلى فيزيائي أو كيميائي.','اذكري الدليل الذي اعتمدتِ عليه في كل تصنيف.']},
l23:{ch:2,name:'المخاليط',life:['التقطير في مصافي النفط','تُفصل مكونات النفط الخام في المصافي بالتقطير حسب اختلاف درجات غليانها، فنحصل على البنزين والديزل والغاز وغيرها. وتعتمد بعض محطات تحلية المياه أيضًا على التقطير.'],
 ch_:[['خليط من برادة الحديد ومسحوق الكبريت. أسهل طريقة لفصله:',['التقطير','التبلور','المغناطيس','الكروماتوجرافيا'],2,'الحديد ينجذب إلى المغناطيس والكبريت لا ينجذب، فنستغل هذا الاختلاف في الخواص.'],
  ['لماذا لا يمكن فصل الملح الذائب في الماء بالترشيح؟',['لأن الملح أثقل من الماء','لأن جسيمات الملح الذائبة تمر من ورقة الترشيح','لأن الماء يتجمد','لأن ورقة الترشيح تذوب'],1,'الملح الذائب يكوّن محلولًا متجانسًا، وجسيماته صغيرة جدًا تمر من الورقة. نفصله بالتبخير أو التقطير.'],
  ['لفصل ألوان الحبر في قلم نستعمل:',['الترشيح','التسامي','المغناطيس','الكروماتوجرافيا'],3,'الكروماتوجرافيا تفصل المكونات حسب قدرتها على الانتقال على سطح مادة أخرى.']],
 task:['لديك خليط من الرمل والملح ونشارة الخشب.','صمّمي خطة لفصل المواد الثلاث، ورتّبي خطواتها.','اذكري الخاصية التي اعتمدتِ عليها في كل خطوة.']},
l24:{ch:2,name:'العناصر والمركبات',life:['منجم مهد الذهب','منجم مهد الذهب في منطقة المدينة المنورة من أقدم مناجم الذهب في العالم. والذهب عنصر يوجد في الطبيعة منفردًا، أما ملح الطعام فمركب من الصوديوم والكلور، وخواصه مختلفة تمامًا عن خواصهما.'],
 ch_:[['الصوديوم فلز نشط والكلور غاز سام، لكن ملح الطعام آمن. لماذا؟',['لأن ملح الطعام مخلوط','لأن خواص المركب تختلف عن خواص عناصره','لأن الصوديوم يختفي','لأن الكلور يتحول إلى صوديوم'],1,'عندما تتحد العناصر كيميائيًا تتكون مادة جديدة لها خواصها الخاصة.'],
  ['الماء H₂O وفوق أكسيد الهيدروجين H₂O₂ يتكونان من العنصرين نفسيهما. هذا مثال على:',['قانون حفظ الكتلة','المخلوط','قانون النسب المتضاعفة','التغير الفيزيائي'],2,'العنصران نفسهما يكوّنان أكثر من مركب بنسب مختلفة، وهذا قانون النسب المتضاعفة.'],
  ['عنصران يقعان في المجموعة نفسها في الجدول الدوري. ماذا نتوقع؟',['تشابه خواصهما','أنهما مركب واحد','أن لهما العدد الذري نفسه','أن أحدهما غاز دائمًا'],0,'عناصر المجموعة الواحدة متشابهة في خواصها الكيميائية.']],
 task:['اختاري عنصرًا موجودًا في جسمك أو في بيتك.','ابحثي عن رمزه وموقعه (الدورة والمجموعة) في الجدول الدوري.','اكتبي استعمالًا واحدًا له في حياتنا.']},
l31:{ch:3,name:'الأفكار القديمة للمادة',life:['من الفلسفة إلى المختبر','بقيت أفكار أرسطو عن المادة مقبولة نحو ألفي عام دون اختبار، حتى جاء دالتون واعتمد على التجارب وقياس كتل المواد. هذه القصة تبيّن لماذا تحتاج الأفكار العلمية إلى دليل.'],
 ch_:[['لماذا لم تُقبل فكرة ديموقريطوس عن الذرات في عصره؟',['لأنها خاطئة تمامًا','لأن الذرات تُرى بالعين','لم يكن لديه دليل تجريبي، وعارضه أرسطو','لأنه عاش بعد دالتون'],2,'لم تكن هناك أدوات لاختبار الفكرة، وكان لأرسطو تأثير كبير فرفض الناس فكرة الذرات.'],
  ['كيف تفسر نظرية دالتون قانون حفظ الكتلة؟',['الذرات لا تفنى ولا تُستحدث، بل يُعاد ترتيبها','الذرات تتحول إلى ذرات أخرى','الكتلة تزيد في التفاعل','الذرات تختفي عند التسخين'],0,'إذا بقيت الذرات نفسها وتغيّر ترتيبها فقط، فإن الكتلة الكلية تبقى ثابتة.'],
  ['أي فكرة من نظرية دالتون عُدّلت لاحقًا؟',['أن المادة تتكون من ذرات','أن الذرات تتحد بنسب بسيطة','أن الذرات يُعاد ترتيبها في التفاعل','أن الذرة لا يمكن تجزئتها'],3,'اكتُشف لاحقًا أن الذرة تتكون من جسيمات أصغر: إلكترونات وبروتونات ونيوترونات.']],
 task:['اكتبي حوارًا قصيرًا بين ديموقريطوس وأرسطو.','يدافع فيه كل منهما عن فكرته عن المادة.','اختمي الحوار برأي دالتون: من كان أقرب إلى الصواب؟ ولماذا؟']},
l32:{ch:3,name:'تعريف الذرة',life:['أنبوب أشعة المهبط في التلفاز القديم','كانت أجهزة التلفاز القديمة تعمل بأنبوب أشعة المهبط نفسه الذي استعمله طومسون: سيل من الإلكترونات يصطدم بشاشة فلورية فتتوهج وتظهر الصورة.'],
 ch_:[['لماذا تنحرف أشعة المهبط عند تقريب مغناطيس منها؟',['لأنها ضوء','لأنها جسيمات مشحونة','لأنها بلا كتلة','لأنها من الحديد'],1,'الجسيمات المشحونة المتحركة تنحرف في المجال المغناطيسي، وهذا دليل على أن أشعة المهبط جسيمات مشحونة.'],
  ['لو كانت الشحنة الموجبة منتشرة في الذرة كما قال طومسون، ماذا كنا سنرى في تجربة رقاقة الذهب؟',['ترتد كل الجسيمات','تتوقف الجسيمات داخل الرقاقة','تنفذ كل الجسيمات تقريبًا بانحراف بسيط','تتحول الجسيمات إلى إلكترونات'],2,'الشحنة المنتشرة ضعيفة في أي نقطة، فلا تكفي لرد جسيمات ألفا السريعة. لذلك كان الارتداد مفاجئًا.'],
  ['لماذا تكون كتلة الذرة أكبر من كتلة بروتوناتها وحدها؟',['لأن الإلكترونات ثقيلة','لأن النواة فارغة','لأن الذرة مشحونة','لوجود النيوترونات في النواة'],3,'النيوترونات لها كتلة قريبة من كتلة البروتون، وتوجد معه في النواة.']],
 sims:['cath','ruth','comp','neut'],
 task:['ارسمي نموذج طومسون ونموذج رذرفورد جنبًا إلى جنب.','اكتبي تحت كل نموذج التجربة التي اعتمد عليها صاحبه.','اكتبي أهم فرق بين النموذجين في جملة واحدة.']},
l33:{ch:3,name:'كيف تختلف الذرات؟',life:['الكربون-14 وأعمار الآثار','يستعمل العلماء نظير الكربون-14 لتقدير أعمار البقايا العضوية في المواقع الأثرية. فالنظائر ليست مجرد فكرة في الكتاب، بل أداة حقيقية لفهم التاريخ.'],
 ch_:[['الكربون-12 والكربون-14 نظيران. ما الذي يختلف بينهما؟',['عدد البروتونات','نوع العنصر','الخواص الكيميائية','عدد النيوترونات'],3,'النظائر لها عدد البروتونات نفسه، وتختلف في عدد النيوترونات، فيختلف العدد الكتلي.'],
  ['لماذا تكون الكتلة الذرية للكلور في الجدول الدوري عددًا غير صحيح؟',['لأنها متوسط موزون لكتل نظائره','لأن الكلور غاز','لأن القياس خاطئ','لأن الكلور ليس له نيوترونات'],0,'للكلور نظائر بكتل مختلفة، والكتلة الذرية متوسطها حسب نسبة وجود كل نظير في الطبيعة.'],
  ['ذرتان لهما العدد الذري نفسه. ماذا نستنتج؟',['أنهما من عنصرين مختلفين','أنهما من العنصر نفسه','أنهما مركب','أن لهما العدد الكتلي نفسه دائمًا'],1,'العدد الذري (عدد البروتونات) هو الذي يحدد هوية العنصر.']],
 sims:['neut'],
 task:['ابحثي عن نظير يُستعمل في الطب.','اكتبي اسمه واستعمالًا واحدًا له.','بماذا يختلف هذا النظير عن النظير الأكثر انتشارًا للعنصر نفسه؟']},
l34:{ch:3,name:'الأنوية غير المستقرة والتحلل الإشعاعي',life:['الطب النووي في مستشفياتنا','تستعمل أقسام الطب النووي في المستشفيات، ومنها مستشفى الملك فيصل التخصصي، مواد مشعة بكميات صغيرة ومدروسة لتصوير أعضاء الجسم وعلاج بعض الأمراض.'],
 ch_:[['أي الإشعاعات يكفي لوح من الورق لإيقافه؟',['جسيمات ألفا','أشعة جاما','جسيمات بيتا','جميعها'],0,'جسيمات ألفا كبيرة الكتلة وموجبة، فتفقد طاقتها بسرعة ويوقفها الورق.'],
  ['لماذا لا تنحرف أشعة جاما بين صفيحتين مشحونتين؟',['لأنها ثقيلة','لأنها بلا شحنة','لأنها موجبة','لأنها بطيئة'],1,'الانحراف في المجال الكهربائي يحتاج إلى شحنة، وأشعة جاما ليس لها شحنة.'],
  ['ما الفرق الأساسي بين التفاعل النووي والتفاعل الكيميائي؟',['في الكيميائي تتغير النواة','لا فرق بينهما','في النووي تتغير النواة وقد يتكون عنصر جديد','التفاعل النووي لا ينتج طاقة'],2,'التفاعل الكيميائي يعيد ترتيب الإلكترونات بين الذرات، أما النووي فيغيّر النواة نفسها.']],
 sims:['ruth'],
 task:['ابحثي عن استعمال سلمي للإشعاع في الطب أو الزراعة أو الصناعة.','اكتبي فقرة قصيرة عنه.','اذكري احتياطًا واحدًا للسلامة عند التعامل مع المواد المشعة.']}
};
const $=id=>document.getElementById(id);
let L='l11';try{const h=(location.hash||'').slice(1);if(D[h])L=h;}catch(e){}
const st={};
function rail(){
 $('rail').innerHTML=[1,2,3].map(c=>`<div class="chap"><b>${CH[c]}</b>${Object.keys(D).filter(k=>D[k].ch===c).map(k=>`<button type="button" class="lesson" data-l="${k}" aria-pressed="${k===L}">${D[k].name}</button>`).join('')}</div>`).join('');
 $('rail').querySelectorAll('.lesson').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{history.replaceState(null,'','#'+L);}catch(e){}rail();render();});
}
function render(){
 const d=D[L];if(!st[L])st[L]={i:0,ans:[]};
 const sims=d.sims?`<section class="card sims"><span class="tag">محاكاة تفاعلية</span><h2>جرّبي بنفسك</h2><p>افتحي المحاكاة ونفّذي التجربة، ثم أجيبي عن أسئلتها.</p><div class="simgrid">${d.sims.map(s=>`<a class="btn" href="${SIMS[s][0]}">${SIMS[s][1]}</a>`).join('')}</div></section>`:'';
 $('main').innerHTML=`<div class="board">
  <section class="card life"><span class="tag">من الحياة</span><h2>${d.life[0]}</h2><p>${d.life[1]}</p></section>
  <section class="card chal" id="chal"></section></div>
  <div class="lower ${sims?'':'single'}" style="margin-top:16px">
  <section class="card task"><span class="tag">مهمة إثرائية</span><h2>نفّذي المهمة</h2><ol>${d.task.map(t=>`<li>${t}</li>`).join('')}</ol><p class="big">سلّمي المهمة لمعلمتك مكتوبة بخط يدك أو في ملف.</p></section>${sims}</div>`;
 chal();
}
function chal(){
 const d=D[L],s=st[L],box=$('chal');
 if(s.i>=d.ch_.length){
  const ok=s.ans.filter(a=>a.ok).length;
  box.innerHTML=`<span class="tag">تحدّي التفكير</span><h2>أنهيتِ التحدي!</h2><div class="stars">${'★'.repeat(ok)}${'☆'.repeat(d.ch_.length-ok)}</div><p>أجبتِ إجابة صحيحة عن ${ok} من ${d.ch_.length} أسئلة من المحاولة الأولى.</p><button type="button" id="again">أعيدي التحدي</button>`;
  $('again').onclick=()=>{st[L]={i:0,ans:[]};chal();};return;
 }
 const q=d.ch_[s.i],a=s.ans[s.i];
 box.innerHTML=`<span class="tag">تحدّي التفكير</span><div class="qnav"><div class="dots">${d.ch_.map((_,k)=>`<i class="${s.ans[k]?(s.ans[k].ok?'ok':'no'):''} ${k===s.i?'cur':''}"></i>`).join('')}</div><span class="big">السؤال ${s.i+1} من ${d.ch_.length}</span></div>
  <div class="q">${q[0]}</div><div class="opts">${q[1].map((o,k)=>`<button type="button" class="opt ${a?(k===q[2]?'right':(k===a.pick?'wrong':'')):''}" data-k="${k}">${o}</button>`).join('')}</div>
  ${a?`<div class="why"><b>${a.ok?'إجابة صحيحة. ':'الإجابة الصحيحة: '+q[1][q[2]]+'. '}</b>${q[3]}</div><button type="button" id="next" style="align-self:flex-start">${s.i<d.ch_.length-1?'السؤال التالي':'عرض النتيجة'}</button>`:''}`;
 box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(s.ans[s.i])return;const k=+b.dataset.k;s.ans[s.i]={pick:k,ok:k===q[2]};chal();});
 const n=$('next');if(n)n.onclick=()=>{s.i++;chal();};
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(D[h]&&h!==L){L=h;rail();render();}});
rail();render();
})();
</script>
