<script>
(function(){
const CH={1:'الفصل الأول: الإلكترونات في الذرات',2:'الفصل الثاني: الجدول الدوري والتدرج في خواص العناصر',3:'الفصل الثالث: المركبات الأيونية والفلزات',4:'الفصل الرابع: الروابط التساهمية'};
const SIMS={};
const D={
c11:{ch:1,name:'الضوء وطاقة الكم',life:['ألوان الألعاب النارية','في احتفالات اليوم الوطني تتلون السماء بألوان الألعاب النارية. كل لون يأتي من عنصر مختلف: فأملاح السترانشيوم تعطي اللون الأحمر، والصوديوم الأصفر، والنحاس الأخضر المزرق، لأن لكل عنصر طيف انبعاث مميزًا.'],
 ch_:[['لماذا تختلف ألوان الألعاب النارية باختلاف المواد المستعملة؟',['لأن كل عنصر يصدر طيف انبعاث مميزًا','لأن الألوان تأتي من الدخان','لأن جميع العناصر تصدر اللون نفسه','لأن الألوان تعتمد على حجم الصاروخ'],0,'عندما تُسخَّن الذرات تُثار إلكتروناتها، ثم تعود فتطلق ضوءًا بأطوال موجية محددة تميز كل عنصر.'],
  ['أي الإشعاعين يحمل فوتونه طاقة أكبر؟',['الأشعة تحت الحمراء','الأشعة فوق البنفسجية لأن ترددها أعلى','لهما الطاقة نفسها','لا يمكن المقارنة'],1,'طاقة الفوتون تتناسب طرديًا مع التردد، وتردد الأشعة فوق البنفسجية أعلى.'],
  ['لماذا عجزت النظرية الموجية وحدها عن تفسير التأثير الكهروضوئي؟',['لأن الضوء لا يصل إلى الفلز','لأن الفلزات لا تحتوي على إلكترونات','لأن انبعاث الإلكترونات يعتمد على تردد الضوء لا على شدته','لأن الضوء ليس له طاقة'],2,'الضوء الخافت عالي التردد يحرر إلكترونات، والضوء الشديد منخفض التردد لا يحررها، وهذا يفسَّر بالفوتونات.']],
 task:['ابحثي عن ألوان اللهب لثلاثة فلزات في اختبار اللهب.','اكتبي اسم كل فلز ولون لهبه.','فسّري سبب اختلاف الألوان مستعملة مفهوم طيف الانبعاث الذري.']},
c12:{ch:1,name:'نظرية الكم والذرة',life:['لوحات النيون المضيئة','تتوهج لوحات المحلات المضيئة لأن الكهرباء تثير إلكترونات ذرات الغاز داخل الأنبوب، فتنتقل إلى مستويات طاقة أعلى، ثم تعود إلى مستوياتها مطلقةً ضوءًا بلون محدد.'],
 ch_:[['لماذا تُصدر ذرة الهيدروجين خطوطًا ضوئية محددة لا طيفًا متصلًا؟',['لأن الهيدروجين غاز','لأن طاقة الإلكترون محددة بمستويات معينة','لأن الإلكترون لا يتحرك','لأن الهيدروجين أخف العناصر'],1,'الإلكترون لا يمتلك إلا قيمًا محددة من الطاقة، فيطلق عند انتقاله فوتونات بطاقات محددة.'],
  ['ما أهم قصور في نموذج بور؟',['لم يفسر أطياف الذرات التي فيها أكثر من إلكترون','لم يفسر طيف الهيدروجين','قال إن الذرة فارغة','أنكر وجود النواة'],0,'نجح نموذج بور مع الهيدروجين فقط، فظهر النموذج الميكانيكي الكمي لتفسير بقية الذرات.'],
  ['ماذا يعني مبدأ الشك لهايزنبرج؟',['أن الإلكترون غير موجود','أن النواة تتحرك باستمرار','أن الذرات متشابهة','أنه لا يمكن معرفة موقع الإلكترون وسرعته بدقة في الوقت نفسه'],3,'أي محاولة لقياس موقع الإلكترون تغيّر سرعته، لذلك نتحدث عن احتمال وجوده لا عن مسار محدد.']],
 task:['قارني في جدول بين نموذج بور والنموذج الميكانيكي الكمي.','اجعلي المقارنة من حيث: حركة الإلكترون، وتحديد موقعه، والذرات التي يفسرها.','اختمي بجملة توضح لماذا تطورت النماذج الذرية.']},
c13:{ch:1,name:'التوزيع الإلكتروني',life:['الطاقة الشمسية في المملكة','تعتمد الخلايا الشمسية، ومنها خلايا محطة سدير للطاقة الشمسية، على عنصر السيليكون. ولذرة السيليكون أربعة إلكترونات تكافؤ، وهذا ما يجعلها مناسبة لصناعة أشباه الموصلات.'],
 ch_:[['لماذا يُكتب توزيع البوتاسيوم [Ar] 4s¹ وليس [Ar] 3d¹؟',['لأن 3d ممتلئ دائمًا','لأن المستوى 4s أقل طاقة من 3d فيمتلئ أولًا','لأن البوتاسيوم ليس له مستوى 3d','لأن التوزيع عشوائي'],1,'حسب مبدأ أوفباو يمتلئ المستوى الأقل طاقة أولًا، و4s أقل طاقة من 3d.'],
  ['كيف تتوزع إلكترونات 2p³ في ذرة النيتروجين حسب قاعدة هوند؟',['إلكترونان في مستوى وواحد في آخر','الثلاثة في مستوى واحد','إلكترون منفرد في كل مستوى من مستويات p الثلاثة','لا تتوزع'],2,'تتوزع الإلكترونات منفردة على المستويات المتساوية في الطاقة قبل أن تزدوج.'],
  ['التوزيع الإلكتروني للسيليكون 1s² 2s² 2p⁶ 3s² 3p². كم إلكترون تكافؤ له؟',['2','14','6','4'],3,'إلكترونات التكافؤ هي إلكترونات المستوى الخارجي (3s² 3p²)، أي أربعة إلكترونات.']],
 task:['اكتبي التوزيع الإلكتروني لثلاثة عناصر من الدورة الثالثة.','ارسمي التمثيل النقطي لكل منها.','ماذا تلاحظين في عدد إلكترونات التكافؤ عبر الدورة؟']},
c21:{ch:2,name:'تطور الجدول الدوري الحديث',life:['تنبؤات مندليف','ترك مندليف في جدوله فراغات، وتنبأ بخواص عناصر لم تكن مكتشفة. وبعد سنوات اكتُشف الجرمانيوم بخواص قريبة جدًا مما توقعه، فثبتت قوة فكرة الترتيب الدوري.'],
 ch_:[['لماذا كان ترك مندليف فراغات في جدوله دليلًا على قوة فكرته؟',['لأنه تنبأ بعناصر اكتُشفت لاحقًا بالخواص التي توقعها','لأن جدوله كان أصغر','لأنه رتب العناصر أبجديًا','لأنه لم يعرف كل العناصر'],0,'التنبؤ الناجح بخواص عناصر مجهولة يدل على أن الترتيب يعكس قانونًا حقيقيًا في الطبيعة.'],
  ['لماذا رُتبت العناصر في الجدول الحديث حسب العدد الذري لا الكتلة الذرية؟',['لأن الكتلة لا يمكن قياسها','لأن الترتيب حسب الكتلة يضع بعض العناصر في غير مكان خواصها','لأن العدد الذري أكبر','لأن مندليف طلب ذلك'],1,'رتّب موزلي العناصر حسب العدد الذري، فاستقامت الخواص الدورية دون استثناءات.'],
  ['عنصر لامع وموصل للكهرباء وقابل للطرق، يقع غالبًا في:',['يمين الجدول','المجموعة 18','يسار الجدول ووسطه','خارج الجدول'],2,'هذه خواص الفلزات، وتقع في يسار الجدول الدوري ووسطه.']],
 task:['ابحثي عن عنصر تنبأ به مندليف قبل اكتشافه.','قارني بين الخواص التي توقعها والخواص الحقيقية للعنصر.','ماذا تستنتجين عن أهمية التنبؤ في العلم؟']},
c22:{ch:2,name:'تصنيف العناصر',life:['معادن المملكة','تستخرج المملكة معادن متنوعة، منها الذهب والنحاس من العناصر الانتقالية في الفئة d، والألومنيوم من الفئة p. ومعرفة فئة العنصر تساعد على توقع خواصه واستعمالاته.'],
 ch_:[['عنصر ينتهي توزيعه الإلكتروني بـ 3s². أين يقع؟',['الدورة 2، المجموعة 3','الدورة 3، المجموعة 2','الدورة 3، المجموعة 13','الدورة 2، المجموعة 2'],1,'رقم مستوى الطاقة الخارجي (3) هو رقم الدورة، وإلكترونا 3s² يضعانه في المجموعة 2.'],
  ['لماذا تتشابه خواص الليثيوم والصوديوم والبوتاسيوم؟',['لأنها في الدورة نفسها','لأن كتلها متساوية','لأن لكل منها إلكترون تكافؤ واحدًا','لأنها غازات'],2,'عناصر المجموعة الواحدة لها العدد نفسه من إلكترونات التكافؤ، فتتشابه خواصها الكيميائية.'],
  ['عنصر ينتهي توزيعه الإلكتروني بالمستوى الفرعي p، فهو من:',['الفئة p','الفئة s','الفئة d','الفئة f'],0,'الفئة تُحدَّد بآخر مستوى فرعي يمتلئ في التوزيع الإلكتروني.']],
 task:['اختاري ثلاثة عناصر تُستخرج في المملكة.','حدّدي فئة كل عنصر ودورته ومجموعته من الجدول الدوري.','اكتبي استعمالًا واحدًا لكل عنصر.']},
c23:{ch:2,name:'تدرج خواص العناصر',life:['بطارية جوالك','تعمل بطاريات الجوال ببطاريات أيون الليثيوم. والليثيوم من أخف الفلزات، ويفقد إلكترون تكافؤه بسهولة، فيصلح لتخزين الطاقة الكهربائية ونقلها.'],
 ch_:[['لماذا يُستعمل الليثيوم في البطاريات؟',['لأنه ثقيل جدًا','لأنه غاز نبيل','لأنه لا يتفاعل','لأنه خفيف ويفقد إلكترونه بسهولة'],3,'طاقة تأين الليثيوم منخفضة، فيفقد إلكترونه بسهولة، وهذا أساس عمل البطارية.'],
  ['لماذا يقل نصف القطر الذري عبر الدورة من اليسار إلى اليمين؟',['لزيادة شحنة النواة التي تجذب الإلكترونات بقوة أكبر','لإضافة مستويات طاقة جديدة','لنقص عدد الإلكترونات','لأن الذرات تفقد نيوتروناتها'],0,'في الدورة الواحدة تبقى الإلكترونات في المستوى نفسه، بينما تزداد شحنة النواة فتشدها أكثر.'],
  ['لماذا يزداد نصف القطر الذري في المجموعة من أعلى إلى أسفل؟',['لنقص شحنة النواة','لإضافة مستويات طاقة جديدة','لأن الإلكترونات تقل','لأن النواة تصغر'],1,'كل دورة جديدة تضيف مستوى طاقة أبعد عن النواة، فيكبر حجم الذرة.']],
 task:['ارسمي مخططًا مبسطًا للجدول الدوري.','ارسمي سهمًا يوضح اتجاه تزايد نصف القطر الذري، وآخر لاتجاه تزايد الكهروسالبية.','فسّري كل اتجاه في جملتين.']},
c31:{ch:3,name:'تكوّن الأيون',life:['ملصق قارورة الماء','تكتب شركات المياه على ملصق القارورة أيونات مثل الصوديوم Na⁺ والكالسيوم Ca²⁺ والمغنيسيوم Mg²⁺ والكلوريد Cl⁻. هذه الأيونات تكونت عندما فقدت ذراتها إلكترونات أو اكتسبتها.'],
 ch_:[['لماذا يكوّن الكالسيوم الأيون Ca²⁺؟',['لأنه يكتسب إلكترونين','لأنه يفقد إلكتروني التكافؤ ليصل إلى توزيع الأرجون','لأنه غاز نبيل','لأنه يفقد بروتونين'],1,'بفقد إلكتروني المستوى الخارجي يصل الكالسيوم إلى توزيع إلكتروني مستقر يشبه الأرجون.'],
  ['أيهما أكبر حجمًا: ذرة الكلور أم أيون الكلوريد Cl⁻؟',['ذرة الكلور','متساويان','أيون الكلوريد','لا يمكن المقارنة'],2,'إضافة إلكترون تزيد التنافر بين الإلكترونات، فيكبر حجم الأيون السالب.'],

const $=id=>document.getElementById(id);
let L='c11';try{const h=(location.hash||'').slice(1);if(D[h])L=h;}catch(e){}
const st={};
function rail(){
 $('rail').innerHTML=[1,2,3,4].map(c=>`<div class="chap"><b>${CH[c]}</b>${Object.keys(D).filter(k=>D[k].ch===c).map(k=>`<button type="button" class="lesson" data-l="${k}" aria-pressed="${k===L}">${D[k].name}</button>`).join('')}</div>`).join('');
 $('rail').querySelectorAll('.lesson').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{history.replaceState(null,'','#'+L);}catch(e){}rail();render();});
}
function render(){
 const d=D[L];if(!st[L])st[L]={i:0,ans:[]};
 const sims=d.sims?`<section class="card sims"><span class="tag">محاكاة تفاعلية</span><h2>جرّبي بنفسك</h2><p>افتحي المحاكاة ونفّذي التجربة، ثم أجيبي عن أسئلتها.</p><div class="simgrid">${d.sims.map(s=>`<a class="btn" href="${SIMS[s][0]}">${SIMS[s][1]}</a>`).join('')}</div></section>`:'';
 $('main').innerHTML=`<div class="board">
  <section class="card life"><span class="tag">من الحياة</span><h2>${d.life[0]}</h2><p>${d.life[1]}</p></section>
  <section class="card chal" id="chal"></section></div>
  <div class="lower ${sims?'':'single'}" style="margin-top:16px">
  <section class="card task"><span class="tag">مهمة إثرائية</span><h2>نفّذي المهمة</h2><ol>${d.task.map(t=>`<li>${t}</li>`).join('')}</ol><p class="big">سلّمي المهمة لمعلمتك مكتوبة بخط يدك أو في ملف.</p></section>${sims}</div>`;
 chal();
}
function chal(){
 const d=D[L],s=st[L],box=$('chal');
 if(s.i>=d.ch_.length){
  const ok=s.ans.filter(a=>a.ok).length;
  box.innerHTML=`<span class="tag">تحدّي التفكير</span><h2>أنهيتِ التحدي!</h2><div class="stars">${'★'.repeat(ok)}${'☆'.repeat(d.ch_.length-ok)}</div><p>أجبتِ إجابة صحيحة عن ${ok} من ${d.ch_.length} أسئلة من المحاولة الأولى.</p><button type="button" id="again">أعيدي التحدي</button>`;
  $('again').onclick=()=>{st[L]={i:0,ans:[]};chal();};return;
 }
 const q=d.ch_[s.i],a=s.ans[s.i];
 box.innerHTML=`<span class="tag">تحدّي التفكير</span><div class="qnav"><div class="dots">${d.ch_.map((_,k)=>`<i class="${s.ans[k]?(s.ans[k].ok?'ok':'no'):''} ${k===s.i?'cur':''}"></i>`).join('')}</div><span class="big">السؤال ${s.i+1} من ${d.ch_.length}</span></div>
  <div class="q">${q[0]}</div><div class="opts">${q[1].map((o,k)=>`<button type="button" class="opt ${a?(k===q[2]?'right':(k===a.pick?'wrong':'')):''}" data-k="${k}">${o}</button>`).join('')}</div>
  ${a?`<div class="why"><b>${a.ok?'إجابة صحيحة. ':'الإجابة الصحيحة: '+q[1][q[2]]+'. '}</b>${q[3]}</div><button type="button" id="next" style="align-self:flex-start">${s.i<d.ch_.length-1?'السؤال التالي':'عرض النتيجة'}</button>`:''}`;
 box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(s.ans[s.i])return;const k=+b.dataset.k;s.ans[s.i]={pick:k,ok:k===q[2]};chal();});
 const n=$('next');if(n)n.onclick=()=>{s.i++;chal();};
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(D[h]&&h!==L){L=h;rail();render();}});
rail();render();
})();
</script>
